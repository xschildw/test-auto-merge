name: test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: mvn-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test